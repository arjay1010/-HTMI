<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAY 棒球互動儀表板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }

        /* 全螢幕 YouTube 背景劇場模式（滿版且禁止點擊干擾） */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none; /* 讓滑鼠穿透影片，只點擊前方的壘包 */
        }

        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 黃金比例 */
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }

        /* 黑色半透明遮罩層 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* 置中容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 大型菱形外框 */
        .large-diamond-orbit {
            position: relative;
            width: 480px;
            height: 480px;
            border: 2px solid rgba(184, 151, 66, 0.4);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 四個角落的互動壘包 */
        .base-node {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: rgba(15, 15, 15, 0.9);
            border: 3px solid #b89742;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 10;
        }

        /* 將內容物（文字與Icon）轉回正向 */
        .base-content {
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #b89742;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        /* 壘包內的圖片 Icon 樣式 */
        .base-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 4px;
            transition: transform 0.3s ease;
        }

        /* 壘包下方的自訂文字 */
        .base-text {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 懸停動態效果 */
        .base-node:hover {
            transform: scale(1.18);
            background-color: #b89742;
            box-shadow: 0 0 25px #b89742;
            border-color: #fff;
        }

        .base-node:hover .base-content {
            color: #000;
        }

        .base-node:hover .base-icon-img {
            transform: scale(1.1);
        }

        /* 點擊選取發光效果 */
        .base-node.selected {
            transform: scale(1.3);
            background-color: #fff;
            border-color: #b89742;
            box-shadow: 0 0 35px #fff, 0 0 15px #b89742;
            animation: pulse 0.5s infinite alternate;
        }

        .base-node.selected .base-content {
            color: #000;
        }

        /* 壘包精準定位在菱形的四個頂點上 */
        .top-base { top: -42.5px; left: -42.5px; }
        .right-base { top: -42.5px; right: -42.5px; }
        .bottom-base { bottom: -42.5px; right: -42.5px; }
        .left-base { bottom: -42.5px; left: -42.5px; }

        /* 中央大圓圈裝飾（寬高 60px，無狼頭） */
        .center-mound {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(184, 151, 66, 0.6);
            background-color: rgba(20, 20, 20, 0.5);
            box-shadow: inset 0 0 10px rgba(184, 151, 66, 0.3);
            pointer-events: none;
            border-radius: 50%; /* 完美正圓 */
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px #fff; }
            100% { box-shadow: 0 0 40px #b89742; }
        }

        /* RWD 手機版自動縮放 */
        @media (max-width: 600px) {
            .large-diamond-orbit {
                transform: rotate(45deg) scale(0.7);
            }
        }
    </style>
</head>
<body>

    <!-- 🎬 YouTube 全螢幕背景影片區 (已成功將您給的 HTML 代碼融合新版自動播放參數) -->
    <div class="video-background">
        <iframe src="https://youtube.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 半透明深色遮罩層 -->
    <div class="overlay"></div>

    <!-- 主要內容區 -->
    <div class="container">
        <div class="large-diamond-orbit">
            
            <!-- 中央放大版裝飾圓圈 -->
            <div class="center-mound"></div>
            
            <!-- 頂部壘包 -->
            <div class="base-node top-base" onclick="handleBaseClick('top')">
                <div class="base-content">
                    <img id="topIcon" class="base-icon-img" src="" alt="icon">
                    <span id="topText" class="base-text"></span>
                </div>
            </div>

            <!-- 右側壘包 -->
            <div class="base-node right-base" onclick="handleBaseClick('right')">
                <div class="base-content">
                    <img id="rightIcon" class="base-icon-img" src="" alt="icon">
                    <span id="rightText" class="base-text"></span>
                </div>
            </div>

            <!-- 底部壘包 -->
            <div class="base-node bottom-base" onclick="handleBaseClick('bottom')">
                <div class="base-content">
                    <img id="bottomIcon" class="base-icon-img" src="" alt="icon">
                    <span id="bottomText" class="base-text"></span>
                </div>
            </div>

            <!-- 左側壘包 -->
            <div class="base-node left-base" onclick="handleBaseClick('left')">
                <div class="base-content">
                    <img id="leftIcon" class="base-icon-img" src="" alt="icon">
                    <span id="leftText" class="base-text"></span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================================
        // 🔥【超直覺全面自訂設定區】請在這裡修改您的所有字體與網址
        // ==========================================================
        const config = {
            // 1.【在這裡直接修改四個壘包下方的文字！】
            labels: {
                top:    "首頁",  
                right:  "FB",  
                bottom: "IG",  
                left:   "YT" 
            },

            // 2. 四個壘包的圖片 Icon 網址
            icons: {
                top:    "https://ibb.co", 
                right:  "https://ibb.co",   
                bottom: "https://ibb.co", 
                left:   "https://ibb.co"  
            },

            // 3. 點擊壘包後，在新分頁跳轉的網頁網址
            links: {
                top:    "https://google.com", 
                right:  "https://facebook.com",   // 請替換為您的 FB 粉絲團網址
                bottom: "https://instagram.com",  // 請替換為您的 IG 專頁網址
                left:   "https://www.youtube.com"     // 請替換為您的 YT 頻道網址
            }
        };

        // 初始化設定，將文字和圖片渲染到網頁上
        document.getElementById('topText').innerText = config.labels.top;
        document.getElementById('topIcon').src = config.icons.top;

        document.getElementById('rightText').innerText = config.labels.right;
        document.getElementById('rightIcon').src = config.icons.right;

        document.getElementById('bottomText').innerText = config.labels.bottom;
        document.getElementById('bottomIcon').src = config.icons.bottom;

        document.getElementById('leftText').innerText = config.labels.left;
        document.getElementById('leftIcon').src = config.icons.left;

        // 處理壘包點擊跳轉與發光效果
        function handleBaseClick(position) {
            // 移除所有壘包的 selected 樣式
            document.querySelectorAll('.base-node').forEach(node => {
                node.classList.remove('selected');
            });
            
            // 為當前點擊的壘包加上 selected 發光效果
            const activeNode = document.querySelector(`.${position}-base`);
            if (activeNode) {
                activeNode.classList.add('selected');
            }

            // 在新視窗/新分頁打開目標連結
            if (config.links[position]) {
                window.open(config.links[position], '_blank');
            }
        }
    </script>
</body>
</html>
