<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球內野壘包主控選單</title>
    <style>
                /* --- 全域重設（✨已升級：支援智慧滑鼠背景視差與緩衝溢出鎖定） --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            overflow: hidden; /* 防止獨立頁面產生不必要的滾動條 */
            background-color: #000;
            position: relative;
        }

        /* 🏆 關鍵核心修改：將背景圖獨立成一個全螢幕容器，寬高強制放大到 106%，留出左右滑動的安全空間 */
        .parallax-bg-layer {
            position: absolute;
            top: -3%;  /* 向上延伸 3% 鎖定邊緣 */
            left: -3%; /* 向左延伸 3% 鎖定邊緣 */
            width: 106%;
            height: 106%;
            
            /* 壓暗背景圖的半透明遮罩，突顯前方的金色細線壘包 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                              url('https://i.ibb.co/gFmFm1Qv/STRAY-1.png');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1; /* 確保背景鎖在最底層，絕對不擋到按鈕 */
            
            /* ✨ 讓背景在移動時呈現出如絲綢般極其流暢的柔和滑動感，絕對不卡頓不晃眼 */
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            will-change: transform; /* 命令顯卡加速，確保手機與低階電腦一樣順暢 */
        }



        /* --- 🏆 核心獨立容器：讓整個球場在視窗中百分之百絕對居中 --- */
        .baseball-standalone-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 40px;
        }
        
        /* 鎖定球場最外圍容器尺寸，支援動態等比例自適應縮放 */
        .field-wrapper {
            position: relative;
            width: 75vmin;  
            height: 75vmin;
            max-width: 550px;
            max-height: 550px;
        }
        
        /* 繪製完美金黃色實線內野 */
        .diamond-lines {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border: 1.5px solid rgba(212, 175, 55, 0.7); 
            transform: rotate(45deg);
            z-index: 1;
        }
        
        /* 投手丘中央圈圈定位 */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        /* 🏆 壘包按鈕：維持標準正方形，並利用 rotate(45deg) 轉成完美菱形 */
        .base-card {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            text-decoration: none;
            color: #fff;
        }
        
        /* 🏆 內容包裹容器：用來把圖片和文字轉回來 (-45deg)，強制水平垂直絕對置中 */
        .base-content-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg); /* 反向旋轉，字才不會跟著歪斜 */
            width: 100%;
            height: 100%;
        }
        
        /* 限定圖標的最大寬高，絕不允許集體爆開破圖 */
        .base-content-inner img {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            object-fit: contain;
            display: block;
        }
        
        .base-content-inner span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
            white-space: nowrap;
            text-align: center;
            display: block;
            width: 100%;
        }
        
        /* 🏆 四個壘包在球場邊角的精密定位與基礎 45 度旋轉（完美融入動畫與排版） */
        .base-2nd { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                       
        .base-2nd:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        
        .base-3rd { top: 50%; left: 0; transform: translateY(-50%) rotate(45deg); }                       
        .base-3rd:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        
        .base-1st { top: 50%; right: 0; transform: translateY(-50%) rotate(45deg); }                      
        .base-1st:hover { transform: translateY(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        
        .base-home { bottom: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }                  
        .base-home:hover { transform: translateX(-50%) rotate(45deg) scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); background: #222; }
        
        /* 當滑鼠懸停在任一按鈕上時，中央圓圈的共振發光特效 */
        .base-card:hover ~ .center-circle {
            box-shadow: 0 0 25px #d4af37;
            transform: translate(-50%, -50%) scale(1.2);
        }
                /* 🏆 終極修正版：利用雙層五角形疊加，強行逼出全閉合金色邊框 */
        .base-home {
            position: absolute;
            bottom: -44px !important; 
            left: 50%;
            transform: translateX(-50%) rotate(0deg) !important;
            width: 88px;
            height: 88px;
            
            /* ✨ 關鍵修改一：移除原本正方形的 border 設定，改由背景和剪裁來做出金色底層 */
            border: none !important;
            background: #d4af37 !important; /* 這個底色會變成未來的金色邊框 */
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }
        
        /* ✨ 關鍵修改二：利用偽元素在上方疊加一個小 2 像素的黑色五角形，藉此露出周圍的金色邊框 */
        .base-home::after {
            content: '';
            position: absolute;
            /* 🏆 四周精準往內縮小 2 像素（這就是邊框的粗細） */
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #111; /* 內部按鈕的黑底色 */
            /* 保持一模一樣的五角形剪裁比例 */
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%);
            z-index: 1;
            transition: background 0.3s ease;
        }

        /* 當滑鼠懸停在本壘上時，背景變亮 */
        .base-home:hover::after {
            background: #222;
        }
        
        /* 修正懸停時的縮放與發光特效，確保下方的尖角也能同步散發金色微光 */
        .base-home:hover {
            transform: translateX(-50%) rotate(0deg) scale(1.1) !important;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8)); /* 利用智慧濾鏡，強迫五角形全身發光 */
        }

        /* 🏆 關鍵修正：內容容器必須浮在最表層 (z-index: 2)，才不會被黑色遮罩蓋住 */
        .base-home .base-content-inner {
            position: relative;
            z-index: 2;
            transform: rotate(0deg) !important;
            padding-bottom: 12px; /* 微調內部間距，讓圖標與文字完美居中 */
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

    <!-- 🏆 關鍵核心修改：在網頁最底層新增這個專屬的視差背景層 -->
    <div class="parallax-bg-layer" id="bg-layer"></div>

    <!-- 獨立版球場主區塊 -->
    <div class="baseball-standalone-container">
        <div class="field-wrapper">
            
            <!-- 金黃色細線內野 -->
            <div class="diamond-lines"></div>

            <!-- 二壘：Instagram -->
            <a href="https://instagram.com" target="_blank" class="base-card base-2nd">
                <div class="base-content-inner">
                    <img src="https://flaticon.com" alt="IG">
                    <span>IG</span>
                </div>
            </a>

            <!-- 三壘：YouTube -->
            <a href="https://youtube.com" target="_blank" class="base-card base-3rd">
                <div class="base-content-inner">
                    <img src="https://flaticon.com" alt="YT">
                    <span>YT</span>
                </div>
            </a>

            <!-- 一壘：Facebook -->
            <a href="https://facebook.com" target="_blank" class="base-card base-1st">
                <div class="base-content-inner">
                    <img src="https://flaticon.com" alt="FB">
                    <span>FB</span>
                </div>
            </a>

            <!-- 本壘：回首頁 -->
            <a href="index.html" target="_self" class="base-card base-home">
                <div class="base-content-inner">
                    <img src="https://flaticon.com" alt="首頁">
                    <span>首頁</span>
                </div>
            </a>

            <!-- 中央圈圈：投手丘 -->
            <div class="center-circle"></div>

        </div>
    </div>

    <!-- 🏆 智慧滑鼠背景視差精密演算指令腳本 -->
    <script>
        const bgLayer = document.getElementById('bg-layer');

        // 僅在電腦等有滑鼠的寬螢幕裝置上啟動視差（手機版會維持完美居中不晃動）
        if (bgLayer && window.innerWidth > 768) {
            window.addEventListener('mousemove', (e) => {
                // 1. 獲取當前網頁視窗的總寬高
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                // 2. 計算滑鼠當前座標在螢幕中的相對百分比位置（轉化為 -0.5 到 0.5 之間）
                const mouseX = (e.clientX / width) - 0.5;
                const mouseY = (e.clientY / height) - 0.5;
                
                // 3. 🏆 核心幾何演算：最大平移限制在 ±25 像素內，正好完美的待在 3% 的安全放大緩衝區內
                // 當滑鼠往左移，背景跟著反向平移，營造極強的實體 3D 球場景深感！
                const moveX = mouseX * 25;
                const moveY = mouseY * 25;
                
                // 執行平移變換指令
                bgLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
</body>
</html>
