<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRAYBaseball</title>
    
    <!-- 網頁標籤的小圖標 (Favicon) -->
    <link rel="icon" type="image/png" href="https://ibb.co">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }

        /* 黑色半透明遮罩層 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* 置中容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 大型菱形外框 */
        .large-diamond-orbit {
            position: relative;
            width: 480px;
            height: 480px;
            border: 2px solid rgba(184, 151, 66, 0.4);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 四個角落的互動壘包 */
        .base-node {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: rgba(15, 15, 15, 0.9);
            border: 3px solid #b89742;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 10;
        }

        /* 將內容物轉回正向 */
        .base-content {
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #b89742;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        /* 壘包內的圖片 Icon 樣式 */
        .base-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 4px;
            transition: transform 0.3s ease;
        }

        /* 壘包下方的自訂文字 */
        .base-text {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 懸停動態效果 */
        .base-node:hover {
            transform: scale(1.18);
            background-color: #b89742;
            box-shadow: 0 0 25px #b89742;
            border-color: #fff;
        }

        .base-node:hover .base-content {
            color: #000;
        }

        .base-node:hover .base-icon-img {
            transform: scale(1.1);
        }

        /* 點擊選取發光效果 */
        .base-node.selected {
            transform: scale(1.3);
            background-color: #fff;
            border-color: #b89742;
            box-shadow: 0 0 35px #fff, 0 0 15px #b89742;
            animation: pulse 0.5s infinite alternate;
        }

        .base-node.selected .base-content {
            color: #000;
        }

        /* 壘包精準定位在菱形的四個頂點上 */
        .top-base { top: -42.5px; left: -42.5px; }
        .right-base { top: -42.5px; right: -42.5px; }
        .bottom-base { bottom: -42.5px; right: -42.5px; }
        .left-base { bottom: -42.5px; left: -42.5px; }

        /* 中央大圓圈裝飾（投手丘） */
        .center-mound {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(184, 151, 66, 0.6);
            background-color: rgba(20, 20, 20, 0.5);
            box-shadow: inset 0 0 10px rgba(184, 151, 66, 0.3);
            pointer-events: none;
            border-radius: 50%;
            z-index: 5;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px #fff; }
            100% { box-shadow: 0 0 40px #b89742; }
        }

        /* RWD 手機版自動縮放 */
        @media (max-width: 600px) {
            .large-diamond-orbit {
                transform: rotate(45deg) scale(0.7);
            }
        }
    </style>
</head>
<body>

    <!-- 半透明深色遮罩層 -->
    <div class="overlay"></div>

    <!-- 主要內容區 -->
    <div class="container">
        <div class="large-diamond-orbit">
            
            <!-- 中央放大版裝飾圓圈 -->
            <div class="center-mound"></div>
            
            <!-- 頂部壘包 -->
            <div class="base-node top-base" onclick="handleBaseClick('top')">
                <div class="base-content">
                    <img id="topIcon" class="base-icon-img" src="" alt="icon">
                    <span id="topText" class="base-text"></span>
                </div>
            </div>

            <!-- 右側壘包 -->
            <div class="base-node right-base" onclick="handleBaseClick('right')">
                <div class="base-content">
                    <img id="rightIcon" class="base-icon-img" src="" alt="icon">
                    <span id="rightText" class="base-text"></span>
                </div>
            </div>

            <!-- 底部壘包 -->
            <div class="base-node bottom-base" onclick="handleBaseClick('bottom')">
                <div class="base-content">
                    <img id="bottomIcon" class="base-icon-img" src="" alt="icon">
                    <span id="bottomText" class="base-text"></span>
                </div>
            </div>

            <!-- 左側壘包 -->
            <div class="base-node left-base" onclick="handleBaseClick('left')">
                <div class="base-content">
                    <img id="leftIcon" class="base-icon-img" src="" alt="icon">
                    <span id="leftText" class="base-text"></span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================================
        // 🔥【超直覺全面自訂設定區】請在這裡修改您的所有字體與網址
        // ==========================================================
        const config = {
            // 四個壘包下方的文字
            labels: {
                top:    "首頁",  
                right:  "FB",  
                bottom: "IG",  
                left:   "YT" 
            },

            // 3. 四個壘包的圖片 Icon 網址 (填入圖片連結，建議用去背的 PNG 檔)
            icons: {
                top:    "https://i.ibb.co/rCptGSd/STRAYICON.png", // NEWS 圖標
                right:  "https://i.ibb.co/W4K1DWsJ/500px-2023-Facebook-icon-svg.webp",   // STAT 圖標
                bottom: "https://i.ibb.co/0j5RpbFs/500px-Instagram-icon.webp", // LIVE 圖標
                left:   "https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp"  // STRAY 圖標
            },

            // 4. 點擊壘包後，在新分頁跳轉的網頁網址
            links: {
                top:    "https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81?authuser=0", // 點擊 NEWS 跳轉到哪裡
                right:  "https://www.facebook.com/groups/1057300540985213/posts/26518693757752541/",      // 點擊 STAT 跳轉到哪裡
                bottom: "https://www.instagram.com/stray.official.baseball/", // 點擊 LIVE 跳轉到哪裡
                left:   "https://www.youtube.com/@Stray%E6%A3%92%E7%90%83%E9%9A%8A"       // 點擊 STRAY 跳轉到哪裡
            }
        };

        // 初始化設定，將文字和圖片渲染到網頁上
        document.getElementById('topText').innerText = config.labels.top;
        document.getElementById('topIcon').src = config.icons.top;

        document.getElementById('rightText').innerText = config.labels.right;
        document.getElementById('rightIcon').src = config.icons.right;

        document.getElementById('bottomText').innerText = config.labels.bottom;
        document.getElementById('bottomIcon').src = config.icons.bottom;

        document.getElementById('leftText').innerText = config.labels.left;
        document.getElementById('leftIcon').src = config.icons.left;

        // 純粹的點擊變色與原分頁跳轉邏輯（無動畫衝突）
        function handleBaseClick(position) {
            // 切換選取發光效果
            document.querySelectorAll('.base-node').forEach(node => {
                node.classList.remove('selected');
            });
            
            const activeNode = document.querySelector(`.${position}-base`);
            if (activeNode) {
                activeNode.classList.add('selected');
            }

            // 在當前分頁直接跳轉網址
            if (config.links[position]) {
                window.location.href = config.links[position];
            }
        }
    </script>
</body>
</html>
