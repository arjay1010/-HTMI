<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Navigation</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;

    font-family:"Microsoft JhengHei",sans-serif;

}



/* ===== 背景影片 ===== */


.video-bg{

    position:fixed;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;

}



.overlay{

    position:fixed;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.25);

    z-index:-1;

}




/* ===== 棒球菱形區 ===== */


.baseball-field{

    position:absolute;

    width:520px;

    height:520px;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

}




/* ===== SVG 菱形線 ===== */


.field-line{

    position:absolute;

    width:100%;
    height:100%;

}



.field-line polygon{

    fill:none;

    stroke:white;

    stroke-width:2;

    opacity:0.85;

}






/* ===== 壘包 ===== */


.base{

    position:absolute;

    width:105px;

    height:105px;

    cursor:pointer;

    transition:.25s;

    z-index:2;

}



.base img{

    width:100%;

    height:100%;

    object-fit:contain;

}



.base:hover{

    transform:scale(1.15);

}



/* ===== 四個位置 ===== */


/* 本壘 */

.home{

    left:207px;

    bottom:-5px;

}



/* 二壘 */

.second{

    left:207px;

    top:-5px;

}



/* 一壘 */

.first{

    right:-5px;

    top:207px;

}



/* 三壘 */

.third{

    left:-5px;

    top:207px;

}





/* ===== 手機版 ===== */


@media(max-width:600px){


.baseball-field{

    width:360px;

    height:360px;

}



.base{

    width:75px;

    height:75px;

}



.home,
.second{

    left:142px;

}



.first,
.third{

    top:142px;

}



}

</style>

</head>


<body>



<!-- 背景影片 -->

<video class="video-bg" autoplay muted loop playsinline>

<source src="你的影片網址.mp4" type="video/mp4">

</video>



<div class="overlay"></div>





<div class="baseball-field">



<!-- 完整菱形線 -->

<svg class="field-line" viewBox="0 0 520 520">

<polygon points="260,20 500,260 260,500 20,260"/>

</svg>





<!-- 本壘 -->

<a href="你的首頁網址" class="base home">

<img src="本壘圖片網址">

</a>




<!-- 一壘 -->

<a href="你的第一頁網址" class="base first">

<img src="一壘圖片網址">

</a>




<!-- 二壘 -->

<a href="你的第二頁網址" class="base second">

<img src="二壘圖片網址">

</a>




<!-- 三壘 -->

<a href="你的第三頁網址" class="base third">

<img src="三壘圖片網址">

</a>



</div>



</body>

</html>
