<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Navigation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft JhengHei",sans-serif;
}


/* ===== 背景影片 ===== */

.video-bg{

    position:fixed;
    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;

}


/* 黑色遮罩 */

.overlay{

    position:fixed;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.25);

    z-index:-1;

}



/* ===== 棒球場導航區 ===== */


.baseball-field{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:420px;
    height:420px;

}



/* 菱形線 */

.line{

    position:absolute;

    height:3px;

    background:white;

    transform-origin:left center;

    opacity:0.85;

}



/* 四條壘線 */


.line1{

    width:180px;

    left:210px;
    top:210px;

    transform:rotate(-45deg);

}


.line2{

    width:180px;

    left:210px;
    top:210px;

    transform:rotate(45deg);

}


.line3{

    width:180px;

    left:80px;
    top:80px;

    transform:rotate(45deg);

}


.line4{

    width:180px;

    left:80px;
    top:340px;

    transform:rotate(-45deg);

}



/* ===== 壘包 ===== */


.base{

    position:absolute;

    width:70px;

    height:70px;

    cursor:pointer;

    transition:.25s;

}


.base img{

    width:100%;

    height:100%;

    object-fit:contain;

}



.base:hover{

    transform:scale(1.15);

}



/* 位置 */


.home{

    left:175px;

    bottom:0;

}



.first{

    right:0;

    top:175px;

}



.second{

    left:175px;

    top:0;

}



.third{

    left:0;

    top:175px;

}



/* 手機 */

@media(max-width:600px){


.baseball-field{

    width:300px;

    height:300px;

}


.base{

    width:55px;

    height:55px;

}


.home{

    left:122px;

}


.second{

    left:122px;

}


.first{

    top:122px;

}


.third{

    top:122px;

}


.line1,
.line2,
.line3,
.line4{

    width:130px;

}


.line1{

    left:150px;
    top:150px;

}


.line2{

    left:150px;
    top:150px;

}


.line3{

    left:55px;
    top:55px;

}


.line4{

    left:55px;
    top:245px;

}



}



</style>

</head>


<body>



<!-- 背景影片 -->

<video class="video-bg" autoplay muted loop playsinline>

    <source src="你的影片網址.mp4" type="video/mp4">

</video>


<div class="overlay"></div>



<!-- 棒球導航 -->


<div class="baseball-field">


    <!-- 菱形線 -->

    <div class="line line1"></div>

    <div class="line line2"></div>

    <div class="line line3"></div>

    <div class="line line4"></div>



    <!-- 壘包 -->


    <a href="你的首頁網址" class="base home">

        <img src="本壘圖片網址">

    </a>



    <a href="你的第一頁網址" class="base first">

        <img src="一壘圖片網址">

    </a>



    <a href="你的第二頁網址" class="base second">

        <img src="二壘圖片網址">

    </a>



    <a href="你的第三頁網址" class="base third">

        <img src="三壘圖片網址">

    </a>



</div>



</body>

</html>
