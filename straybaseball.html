<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Menu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;

}


/* 背景影片 */

.bg-video{

    position:fixed;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;

}


.dark{

    position:fixed;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.25);

    z-index:-1;

}



/* 主容器 */

.field{

    position:absolute;

    width:520px;

    height:520px;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

}




/* 菱形線 */

.diamond{

    position:absolute;

    width:100%;

    height:100%;

}



.diamond polygon{

    fill:none;

    stroke:white;

    stroke-width:1.5;

}




/* 壘包 */

.base{

    position:absolute;

    width:90px;

    height:90px;

    transform:translate(-50%,-50%);

    cursor:pointer;

    transition:.25s;

    z-index:5;

}


.base img{

    width:100%;
    height:100%;

    object-fit:contain;

}


.base:hover{

    scale:1.15;

}



/* 四個角精準對齊 */

.second{

    left:50%;

    top:10%;

}



.first{

    left:90%;

    top:50%;

}



.home{

    left:50%;

    top:90%;

}



.third{

    left:10%;

    top:50%;

}





/* 手機 */

@media(max-width:600px){


.field{

    width:360px;

    height:360px;

}



.base{

    width:70px;

    height:70px;

}



}


</style>

</head>


<body>



<!-- 背景影片 -->

<video class="bg-video" autoplay muted loop playsinline>

<source src="你的影片網址.mp4" type="video/mp4">

</video>


<div class="dark"></div>



<div class="field">


<!-- 完整菱形 -->

<svg class="diamond" viewBox="0 0 100 100">

<polygon points="
50,10
90,50
50,90
10,50
"/>

</svg>



<!-- 二壘 -->

<a href="你的二壘網址" class="base second">

<img src="你的二壘圖片">

</a>



<!-- 一壘 -->

<a href="你的一壘網址" class="base first">

<img src="你的一壘圖片">

</a>



<!-- 本壘 -->

<a href="你的本壘網址" class="base home">

<img src="你的本壘圖片">

</a>



<!-- 三壘 -->

<a href="你的三壘網址" class="base third">

<img src="你的三壘圖片">

</a>



</div>


</body>
</html>
