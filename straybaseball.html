<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球菱形互動儀表板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        /* 全螢幕影片背景 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 黑色半透明遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* 主要置中容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 大型菱形外框 */
        .large-diamond-orbit {
            position: relative;
            width: 480px;
            height: 480px;
            border: 2px solid rgba(184, 151, 66, 0.4);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 四個角落的互動壘包 */
        .base-node {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: rgba(15, 15, 15, 0.9);
            border: 3px solid #b89742;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 10;
        }

        /* 內容物轉回正向 */
        .base-content {
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #b89742;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        /* 壘包內的圖片 Icon 樣式 */
        .base-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 4px;
            transition: transform 0.3s ease;
        }

        /* 壘包文字 */
        .base-text {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* 懸停效果 */
        .base-node:hover {
            transform: scale(1.18);
            background-color: #b89742;
            box-shadow: 0 0 25px #b89742;
            border-color: #fff;
        }

        .base-node:hover .base-content {
            color: #000;
        }

        /* 讓圖片在懸停時稍微放大 */
        .base-node:hover .base-icon-img {
            transform: scale(1.1);
        }

        /* 點擊選取效果 */
        .base-node.selected {
            transform: scale(1.3);
            background-color: #fff;
            border-color: #b89742;
            box-shadow: 0 0 35px #fff, 0 0 15px #b89742;
            animation: pulse 0.5s infinite alternate;
        }

        .base-node.selected .base-content {
            color: #000;
        }

        /* 精準定位在大型菱形的四個頂點 */
        .top-base { top: -42.5px; left: -42.5px; }
        .right-base { top: -42.5px; right: -42.5px; }
        .bottom-base { bottom: -42.5px; right: -42.5px; }
        .left-base { bottom: -42.5px; left: -42.5px; }

                /* 中央迷你裝飾壘包（無狼頭） */
        .center-mound {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(184, 151, 66, 0.6);
            background-color: rgba(20, 20, 20, 0.5);
            box-shadow: inset 0 0 10px rgba(184, 151, 66, 0.3);
            pointer-events: none;
            border-radius: 50%; /* 👈 加上這行，立刻變成圓形 */
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px #fff; }
            100% { box-shadow: 0 0 40px #b89742; }
        }

        @media (max-width: 600px) {
            .large-diamond-orbit {
                transform: rotate(45deg) scale(0.7);
            }
        }
    </style>
</head>
<body>

    <!-- 背景影片區 -->
    <div class="video-background">
        <video id="bgVideo" autoplay loop muted playsinline></video>
    </div>

    <div class="overlay"></div>

    <div class="container">
        <div class="large-diamond-orbit">
            
            <div class="center-mound"></div>
            
            <!-- 頂部壘包 -->
            <div class="base-node top-base" onclick="handleBaseClick('top')">
                <div class="base-content">
                    <img id="topIcon" class="base-icon-img" src="" alt="icon">
                    <span class="base-text">NEWS</span>
                </div>
            </div>

            <!-- 右側壘包 -->
            <div class="base-node right-base" onclick="handleBaseClick('right')">
                <div class="base-content">
                    <img id="rightIcon" class="base-icon-img" src="" alt="icon">
                    <span class="base-text">STAT</span>
                </div>
            </div>

            <!-- 底部壘包 -->
            <div class="base-node bottom-base" onclick="handleBaseClick('bottom')">
                <div class="base-content">
                    <img id="bottomIcon" class="base-icon-img" src="" alt="icon">
                    <span class="base-text">LIVE</span>
                </div>
            </div>

            <!-- 左側壘包 -->
            <div class="base-node left-base" onclick="handleBaseClick('left')">
                <div class="base-content">
                    <img id="leftIcon" class="base-icon-img" src="" alt="icon">
                    <span class="base-text">STRAY</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 🔥【自訂設定區】請在這裡修改您的網址與圖片
        // ==========================================
        
        const config = {
            // 1. 全螢幕背景影片網址 (必須是直連 .mp4 檔案的網址)
            videoUrl: "搞笑2.mp4",

            // 2. 四個壘包的圖片 Icon 網址 (填入圖片連結，建議用去背的 PNG 檔)
            icons: {
                top:    "https://i.ibb.co/rCptGSd/STRAYICON.png", // NEWS 圖標
                right:  "https://i.ibb.co/W4K1DWsJ/500px-2023-Facebook-icon-svg.webp",   // STAT 圖標
                bottom: "https://i.ibb.co/0j5RpbFs/500px-Instagram-icon.webp", // LIVE 圖標
                left:   "https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp"  // STRAY 圖標
            },

            // 3. 點擊壘包後，在新分頁跳轉的網頁網址
            links: {
                top:    "https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81?authuser=0", // 點擊 NEWS 跳轉到哪裡
                right:  "https://www.facebook.com/groups/1057300540985213/posts/26518693757752541/",      // 點擊 STAT 跳轉到哪裡
                bottom: "https://www.instagram.com/stray.official.baseball/", // 點擊 LIVE 跳轉到哪裡
                left:   "https://www.youtube.com/@Stray%E6%A3%92%E7%90%83%E9%9A%8A"       // 點擊 STRAY 跳轉到哪裡
            }
        };

        // ==========================================
        // ⚙️ 系統核心邏輯 (請勿隨意更動)
        // ==========================================
        
        // 初始化載入影片與圖片
        document.getElementById('bgVideo').src = config.videoUrl;
        document.getElementById('topIcon').src = config.icons.top;
        document.getElementById('rightIcon').src = config.icons.right;
        document.getElementById('bottomIcon').src = config.icons.bottom;
        document.getElementById('leftIcon').src = config.icons.left;

        // 處理點擊與動畫
        function handleBaseClick(position) {
            const eventTarget = document.querySelector(`.${position}-base`);
            
            // 清除其他選取狀態
            document.querySelectorAll('.base-node').forEach(node => node.classList.remove('selected'));
            
            // 加上選取特效
            eventTarget.classList.add('selected');
            
            // 延遲 0.5 秒後跳轉分頁
            setTimeout(() => {
                window.open(config.links[position], '_blank');
                eventTarget.classList.remove('selected');
            }, 500);
        }
    </script>
</body>
</html>
