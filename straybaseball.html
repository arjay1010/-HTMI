<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stray Baseball</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

width:100vw;
height:100vh;

overflow:hidden;

background:#000;

}


/* =========================
背景影片
========================= */


.video-bg{

position:fixed;

width:100%;
height:100%;

object-fit:cover;

z-index:-3;

}



.overlay{

position:fixed;

width:100%;
height:100%;


background:

rgba(0,0,0,0.55);


z-index:-2;

}




/* =========================
棒球內野區
========================= */


.field{


position:absolute;


width:min(65vw,520px);


aspect-ratio:1;


left:50%;


top:50%;



transform:

translate(-50%,-50%);


}





/* =========================
金色內野線
========================= */


.line{


position:absolute;


background:#B8931E;


}



/* 左斜線 */


.left-line{


width:3px;


height:70%;


left:15%;


top:15%;



transform:

rotate(45deg);


}



/* 右斜線 */


.right-line{


width:3px;


height:70%;


right:15%;


top:15%;



transform:

rotate(-45deg);


}



/* 上方線 */


.baseline{


width:70%;


height:3px;


top:15%;


left:15%;


}






/* =========================
壘包
========================= */


.base{


position:absolute;


width:9%;


aspect-ratio:1;



background:#B8931E;


cursor:pointer;



display:flex;


align-items:center;


justify-content:center;




transform:


translate(-50%,-50%)


rotate(45deg);




transition:.6s ease;


}






/* ICON */


.base img{


width:60%;


height:60%;


object-fit:contain;



transform:


rotate(-45deg);



transition:.5s;


}





/* 滑過 */


.base:hover{


box-shadow:


0 0 20px #B8931E;


}





/* 點擊 */


.base.active{


background:#B8931E;



transform:


translate(-50%,-50%)


rotate(45deg)


scale(1.25);



}






/* =========================
四個壘包位置
========================= */



.home{


left:50%;


bottom:8%;


}



.first{


right:8%;


top:50%;


}



.second{


left:50%;


top:8%;


}



.third{


left:8%;


top:50%;


}







/* 手機版 */


@media(max-width:600px){


.field{


width:85vw;


}



.base{


width:11%;


}



}




</style>


</head>



<body>



<!-- 背景影片 -->

<video autoplay muted loop class="video-bg">


<source src="4月13日(投打對決).mp4" type="video/mp4">


</video>



<div class="overlay"></div>





<div class="field">



<!-- 內野線 -->


<div class="line baseline"></div>


<div class="line left-line"></div>


<div class="line right-line"></div>






<!-- 壘包 ICON -->


<div class="base home">


<img src="https://i.ibb.co/rCptGSd/STRAYICON.png">


</div>




<div class="base first">


<img src="https://i.ibb.co/W4K1DWsJ/500px-2023-Facebook-icon-svg.webp">


</div>





<div class="base second">


<img src="https://i.ibb.co/0j5RpbFs/500px-Instagram-icon.webp">


</div>





<div class="base third">


<img src="https://i.ibb.co/LXN2tf5N/960px-You-Tube-full-color-icon-2017-svg.webp">


</div>



</div>








<script>



const links={



home:

"https://sites.google.com/view/straybaseball-team/%E9%A6%96%E9%A0%81?authuser=0",



first:

"https://www.facebook.com/groups/1057300540985213/posts/26518693757752541/",



second:

"https://www.instagram.com/stray.official.baseball/",



third:

"https://www.youtube.com/@Stray%E6%A3%92%E7%90%83%E9%9A%8A/videos"



};






document.querySelectorAll(".base")

.forEach(base=>{


base.onclick=function(){



this.classList.add("active");



let target;



if(this.classList.contains("home"))

target=links.home;



if(this.classList.contains("first"))

target=links.first;



if(this.classList.contains("second"))

target=links.second;



if(this.classList.contains("third"))

target=links.third;




setTimeout(()=>{


window.location.href=target;


},600);




}



});




</script>



</body>


</html>
